<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input,select{font:inherit;color:inherit}
input::placeholder{color:#4A4F4D;opacity:1}
a{color:#1F5A53}a:hover{color:#0A3530}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F8F7F3; color: #1B1D1C; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums">

<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px">
<div style="font-size: 17px; font-weight: 700">October 2026</div>
<div style="font-size: 13px; font-weight: 600; color: #4A4F4D; margin-top: 12px">Net worth</div>
<div style="font-size: 38px; font-weight: 800; letter-spacing: -1px">€24,118.40</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12, 14, 13, 0.48)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="qa-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 744px; box-sizing: border-box; background: #F2F1EC; border-radius: 28px 28px 0 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">
<div aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #767C79; margin: 2px 0 2px"></div>

<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Close" style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 24px; color: #4A4F4D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<h2 id="qa-title" style="margin: 0; font-size: 17px; font-weight: 700">New transaction</h2>
</div>
<div style="display: flex; align-items: center">
<button type="button" aria-label="Split across categories" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 24px; color: #4A4F4D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-7.5L5 6.5M12 13.5l7-7M5 11V6.5h4.5M19 11V6.5h-4.5"></path></svg></button>
<button type="button" aria-label="Attach receipt" style="width: 48px; height: 48px; margin-right: -12px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 24px; color: #4A4F4D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.3l1.5-2.5h5.4L16.2 7h2.3A1.5 1.5 0 0 1 20 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-10Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
</div>
</div>

<div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border: 1px solid #767C79; border-radius: 22px; overflow: hidden">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: #FCE3D2; color: #5C2804; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Expense</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: center; border: 0; border-left: 1px solid #767C79; background: transparent; color: #1B1D1C; font-size: 14px; font-weight: 600">Income</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: center; border: 0; border-left: 1px solid #767C79; background: transparent; color: #1B1D1C; font-size: 14px; font-weight: 600">Transfer</button>
</div>

<div style="height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<output aria-label="Amount" style="display: flex; align-items: baseline; gap: 2px; color: #A24A0E; font-weight: 800; letter-spacing: -1.2px"><span style="font-size: 30px">€</span><span style="font-size: 50px; line-height: 56px">24.80</span><span aria-hidden="true" style="width: 2px; height: 40px; background: #1F5A53; margin-left: 3px; align-self: center"></span></output>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 24px"><span style="font-size: 13px; font-weight: 700; color: #4A4F4D">Recent categories</span></div>
<div role="radiogroup" aria-label="Category" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<button type="button" role="radio" aria-checked="true" style="height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; background: #D5E6E1; color: #0F2E29; font-size: 12px; font-weight: 700; padding: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #1F5A53; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"></path><circle cx="9.5" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg></span>Groceries</button>
<button type="button" role="radio" aria-checked="false" style="height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; background: transparent; color: #1B1D1C; font-size: 12px; font-weight: 600; padding: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #F7EBCB; color: #7A5900; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"></path><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"></path></svg></span>Eating out</button>
<button type="button" role="radio" aria-checked="false" style="height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; background: transparent; color: #1B1D1C; font-size: 12px; font-weight: 600; padding: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #DFE6F2; color: #3A5A8F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="14" rx="2.5"></rect><path d="M5 11h14M8 17.5V20M16 17.5V20M8.5 14.5h.01M15.5 14.5h.01"></path></svg></span>Transport</button>
<button type="button" role="radio" aria-checked="false" style="height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; background: transparent; color: #1B1D1C; font-size: 12px; font-weight: 600; padding: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #F6E0DB; color: #8A3B2E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12.5H6L5 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg></span>Shopping</button>
<button type="button" style="height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; background: transparent; color: #1B1D1C; font-size: 12px; font-weight: 600; padding: 0"><span style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #767C79; box-sizing: border-box; color: #4A4F4D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>All</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid #E0DFD9; border-radius: 12px; background: #FFFFFF; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4F4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3.5 20h17"></path></svg><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 12px; font-weight: 600; color: #4A4F4D">Account</span><span style="font-size: 14px; font-weight: 700; white-space: nowrap">Everyday checking</span></span></button>
<button type="button" style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid #E0DFD9; border-radius: 12px; background: #FFFFFF; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4F4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 12px; font-weight: 600; color: #4A4F4D">Date</span><span style="font-size: 14px; font-weight: 700; white-space: nowrap">Today, 23 Oct</span></span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 0; height: 52px; box-sizing: border-box; border: 1px solid #E0DFD9; border-radius: 12px; background: #FFFFFF; padding: 6px 12px 0">
<label for="qa-payee" style="font-size: 12px; font-weight: 600; color: #4A4F4D">Payee or note</label>
<input id="qa-payee" type="text" value="Corner Grocer" style="height: 24px; border: 0; padding: 0; background: transparent; outline: none; font-size: 14px; font-weight: 600; color: #1B1D1C">
</div>

<div aria-label="Amount keypad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">1</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">2</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">3</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">4</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">5</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">6</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">7</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">8</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">9</button>
<button type="button" aria-label="Decimal point" style="height: 48px; border: 0; border-radius: 12px; background: #E6E5DF; font-size: 22px; font-weight: 700">.</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 22px; font-weight: 600">0</button>
<button type="button" aria-label="Delete digit" style="height: 48px; border: 0; border-radius: 12px; background: #E6E5DF; display: flex; align-items: center; justify-content: center; color: #1B1D1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.5L3 12l5.5-7Z"></path><path d="m11 9.5 5 5M16 9.5l-5 5"></path></svg></button>
</div>

<button type="button" style="height: 52px; margin-top: 2px; border: 0; border-radius: 26px; background: #1F5A53; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Save expense</button>
</section>

</div>
</x-dc>
