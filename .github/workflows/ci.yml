name: CI

# Runs on every version tag: release.yml calls this workflow for each vX.Y.Z
# tag and passes the tag. Platform builds happen in release.yml.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: dart run tool/l10n.dart --check
      - run: dart run tool/version.dart --check --tag "${{ inputs.tag }}"
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
